[workspace]
members = [
    "crates/core",
    "crates/adapters",
    "crates/storage",
    "crates/app",
    "crates/cli",
    "crates/mcp",
    "apps/desktop/src-tauri",
]
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.89"

[workspace.dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
dunce = "1.0.5"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1.2.3"
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v4", "v5", "serde"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
clap = { version = "4.6.7", features = ["derive"] }
tempfile = "3.27.0"
assert_cmd = "2.2.2"
sha2 = "0.10.9"
encoding_rs = "0.8.42"
quick-xml = "0.42.0"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
pdf-extract = "0.12.1"
ureq = { version = "3.5.0", features = ["json", "win-system-proxy"] }
tiny_http = "0.12.0"
rmcp = { version = "3.8.0", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
